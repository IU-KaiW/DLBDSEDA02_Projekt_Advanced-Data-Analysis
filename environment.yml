name: Projekt_Advanced-Data-Analysis
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  
  # Core Data Processing
  - pandas=2.2.3
  - numpy=1.26.4
  - scipy=1.11.4
  
  # Visualization
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - plotly=5.14.0
  
  # Jupyter & Interactive Widgets
  - ipython=8.12.0
  - jupyter=1.0.0
  - ipykernel
  - nbformat
  - ipywidgets=8.0.0
  
  # Machine Learning
  - scikit-learn=1.6.1
  
  # NLP - spaCy
  - spacy=3.7.5
  
  # NLP - Gensim (Topic Modeling)
  - gensim=4.3.2
  
  # Deep Learning Backend (CPU-only)
  - pytorch=2.0.0
  - torchvision=0.15.1
  - cpuonly
  
  # Pip-only packages
  - pip
  - pip:
      # Transformer-basierte Modelle
      - transformers==4.30.0
      - tokenizers==0.13.3
      - sentence-transformers==2.2.2
      - huggingface-hub==0.16.4
      
      # Topic Modeling
      - bertopic==0.16.0
      
      # Visualisierung
      - wordcloud==1.9.3
      
      # spaCy Sprachmodell (manuell)
      # Nach Installation ausführen:
      # python -m spacy download en_core_web_sm
