name: Projekt_Advanced-Data-Analysis
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  
  # Core Data Processing
  - pandas>=2.0.0
  - numpy>=1.24.0
  - scipy>=1.10.0
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - plotly>=5.14.0
  
  # Jupyter & Interactive Widgets
  - ipython>=8.12.0
  - jupyter>=1.0.0
  - ipywidgets>=8.0.0
  
  # Machine Learning
  - scikit-learn>=1.3.0
  
  # NLP - spaCy
  - spacy>=3.7.0
  
  # NLP - Gensim (Topic Modeling)
  - gensim>=4.3.0
  
  # Deep Learning Backend (CPU-only)
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - cpuonly
  
  # Pip-only packages
  - pip
  - pip:
      # Transformer-basierte Modelle
      - transformers>=4.30.0
      - sentence-transformers>=2.2.0
      
      # Topic Modeling
      - bertopic>=0.15.0
      
      # Visualisierung
      - wordcloud>=1.9.0
      
      # spaCy Sprachmodell (manuell)
      # Nach Installation ausführen:
      # python -m spacy download en_core_web_sm
